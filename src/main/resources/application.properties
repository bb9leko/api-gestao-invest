quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.exposed-headers=*
quarkus.http.cors.enabled=true

quarkus.http.port=8081

#Configurações PostGres SQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:admin}
quarkus.datasource.password=${DB_PASSWORD:admin}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}

# Kafka
mp.messaging.outgoing.transacoes-out.connector=smallrye-kafka
mp.messaging.outgoing.transacoes-out.topic=transacoes
mp.messaging.outgoing.transacoes-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
kafka.bootstrap.servers=localhost:9092

# Testcontainers
quarkus.devservices.enabled=true

